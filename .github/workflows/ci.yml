name: CI

# Build check: install dependencies and confirm the app imports and compiles
# on every push and pull request to main.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile src/app.py

      - name: Import smoke test
        run: python -c "import sys; sys.path.insert(0, 'src'); import app; print('import OK, server:', app.server is not None)"
